name: Build Desktop Executable (.exe)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install dependencies & Build Web App
        run: |
          npm install
          npm run build

      - name: Build Standalone Windows Executable (.exe)
        run: |
          dotnet publish desktop-app/ObsidianLocalAI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Obsidian-Local-AI-Windows-EXE
          path: publish/ObsidianLocalAI.exe
