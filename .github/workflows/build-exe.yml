name: Build Desktop Executable (.exe)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web App & Windows Executable
        run: npm run electron:build

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Obsidian-Local-AI-Windows-EXE
          path: release/*.exe
